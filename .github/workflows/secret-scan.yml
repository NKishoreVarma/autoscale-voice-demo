name: secret-scan

# Fails the workflow if a likely secret is committed. Two independent gates:
#   1. Gitleaks (reputable scanner) with our .gitleaks.toml
#   2. The repo's own scanner over all tracked files (defense in depth)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so Gitleaks can scan past commits
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # GITLEAKS_LICENSE is only required for GitHub organizations, not personal repos.

  repo-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan all tracked files
        run: node scripts/secret-scan.mjs --tree
